<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode AI Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <span class="robot-icon">🤖</span>
        <h1>AI Assistant</h1>
      </div>
      <div class="version">v1.0.0</div>
    </div>

    <!-- Status Section -->
    <div class="status-section">
      <div class="status-item">
        <span class="status-label">Status:</span>
        <span class="status-value" id="extension-status">Checking...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Problem:</span>
        <span class="status-value" id="current-problem">None detected</span>
      </div>
    </div>

    <!-- API Configuration -->
    <div class="config-section">
      <h3>Configuration</h3>
      
      <div class="form-group">
        <label for="ai-provider">AI Provider:</label>
        <select id="ai-provider">
          <option value="gpt-4-1-mini">OpenAI GPT-4.1 Mini</option>
          <option value="gemini-2-5-flash">Google Gemini 2.5 Flash</option>
        </select>
      </div>

      <div class="form-group">
        <label for="api-key" id="api-key-label">API Key:</label>
        <div class="input-group">
          <input type="password" id="api-key" placeholder="Enter your API key..." />
          <button id="toggle-key-visibility" class="toggle-btn">👁️</button>
        </div>
        <div class="help-text" id="api-help-text">
          Get your API key from the provider's dashboard
        </div>
      </div>

      <div class="form-group">
        <label for="hint-level">Default Hint Level:</label>
        <select id="hint-level">
          <option value="1">Level 1 - High-level approach</option>
          <option value="2">Level 2 - Algorithm suggestions</option>
          <option value="3">Level 3 - Implementation hints</option>
          <option value="4">Level 4 - Detailed guidance</option>
        </select>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="actions-section">
      <h3>Quick Actions</h3>
      
      <button id="toggle-assistant" class="action-button primary">
        <span class="button-icon">🎯</span>
        <span class="button-text">Toggle Assistant</span>
      </button>
      
      <button id="analyze-problem" class="action-button">
        <span class="button-icon">🔍</span>
        <span class="button-text">Analyze Problem</span>
      </button>
      
      <button id="get-hint" class="action-button">
        <span class="button-icon">💡</span>
        <span class="button-text">Get Hint</span>
      </button>
    </div>

    <!-- Settings -->
    <div class="settings-section">
      <h3>Settings</h3>
      
      <div class="form-group">
        <label for="panel-position">Panel Position:</label>
        <select id="panel-position">
          <option value="right">Right Side</option>
          <option value="left">Left Side</option>
        </select>
      </div>
      
      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="auto-analyze" checked>
          <span class="checkmark"></span>
          Auto-analyze problems
        </label>
      </div>
      
      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="show-hints" checked>
          <span class="checkmark"></span>
          Show hint buttons
        </label>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="save-status" id="save-status"></div>
      <div class="links">
        <a href="#" id="help-link">Help</a>
        <span class="separator">|</span>
        <a href="#" id="feedback-link">Feedback</a>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
