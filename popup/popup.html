<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetWhisper</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-identity">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L13.09 8.26L22 9L13.09 9.74L12 16L10.91 9.74L2 9L10.91 8.26L12 2Z" fill="currentColor"/>
            <circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.7"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-name">LeetWhisper</h1>
          <span class="brand-tagline">Smart LeetCode Assistant</span>
        </div>
      </div>
      <div class="status-indicator">
        <div class="status-dot" id="connection-status"></div>
        <span class="status-text" id="status-text">Connected</span>
      </div>
    </div>

    <!-- Problem Context Card -->
    <div class="context-card">
      <div class="card-header">
        <h2 class="card-title">Current Problem</h2>
        <div class="problem-badge" id="problem-difficulty">Medium</div>
      </div>
      <div class="card-content">
        <p class="problem-title" id="current-problem">Select a LeetCode problem to get started</p>
        <div class="problem-stats">
          <div class="stat-item">
            <span class="stat-label">Status</span>
            <span class="stat-value" id="extension-status">Ready</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Configuration Panel -->
    <div class="config-panel">
      <div class="panel-header">
        <h3 class="panel-title">
          <svg class="panel-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
          </svg>
          Configuration
        </h3>
      </div>
      
      <div class="form-section">
        <div class="input-group">
          <label for="ai-provider" class="input-label">AI Provider</label>
          <div class="select-wrapper">
            <select id="ai-provider" class="select-input">
              <option value="gpt-4-1-mini">OpenAI GPT-4.1 Mini</option>
              <option value="gemini-2-5-flash">Google Gemini 2.5 Flash</option>
            </select>
            <svg class="select-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </div>
        </div>

        <div class="input-group">
          <label for="api-key" id="api-key-label" class="input-label">API Key</label>
          <div class="password-input-wrapper">
            <input type="password" id="api-key" class="text-input" placeholder="Enter your API key..." />
            <button id="toggle-key-visibility" class="password-toggle" type="button">
              <svg class="eye-icon" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
              </svg>
            </button>
          </div>
          <div class="help-text" id="api-help-text">
            <svg class="help-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
            </svg>
            Get your API key from the provider's dashboard
          </div>
        </div>

        <div class="input-group">
          <label for="hint-level" class="input-label">Default Hint Level</label>
          <div class="select-wrapper">
            <select id="hint-level" class="select-input">
              <option value="1">Conceptual - High-level approach & algorithms</option>
              <option value="3">Implementation - Code structure & detailed guidance</option>
            </select>
            <svg class="select-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Preferences Section -->
    <div class="preferences-section">
      <div class="settings-card">
        <div class="settings-header">
          <h4 class="settings-title">Preferences</h4>
        </div>
        <div class="setting-item">
          <label for="panel-position" class="setting-label">Panel Position</label>
          <div class="select-wrapper mini">
            <select id="panel-position" class="select-input">
              <option value="right">Right Side</option>
              <option value="left">Left Side</option>
            </select>
            <svg class="select-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
